{% extends 'monApp/base.html' %}
{% block contenu %}
<h1> Suppression d'un produit dans un rayon </h1>
<form action="" method="post" >
{% csrf_token %}
<p>Etes-vous sûr de vouloir supprimer ce produit {{ object.produit.intituleProd }} du rayon {{ object.rayon.nomRayon }} ?</p>
<button type="submit" class="btn btn-success mt-2">Confirmer</button>
</form>
{% endblock %}
